        document.addEventListener("DOMContentLoaded", () => {
            const buttons = document.querySelectorAll('.year-btn');
            
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    buttons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    const selectedYear = e.target.getAttribute('data-year');
                    renderSongs(selectedYear);
                });
            });

            renderSongs('all');

            const backToTopBtn = document.getElementById("backToTopBtn");
            window.addEventListener("scroll", () => {
                if (window.scrollY > 300) backToTopBtn.classList.add("show");
                else backToTopBtn.classList.remove("show");
            });
            backToTopBtn.addEventListener("click", (e) => {
                e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" });
            });
        });

        function renderSongs(yearFilter) {
            const container = document.getElementById('songContainer');
            container.innerHTML = '';

            let filteredSongs = songData;
            if (yearFilter !== 'all') {
                filteredSongs = songData.filter(song => song.year === yearFilter);
            }

            document.getElementById('resultCount').innerText = `共載入 ${filteredSongs.length} 首歌曲`;

            filteredSongs.forEach((song) => {
                const item = document.createElement('a');
                item.href = song.link;
                item.target = "_blank";
                item.className = 'group bg-white p-5 rounded-2xl shadow-sm hover:shadow-lg transition-all duration-300 border border-gray-100 flex items-center gap-4 hover:-translate-y-1 block';
                
                item.innerHTML = `
                    <div class="w-12 h-12 bg-transformative-teal/10 group-hover:bg-transformative-teal text-transformative-teal group-hover:text-white rounded-full flex items-center justify-center shrink-0 transition-colors duration-300">
                        <i class="fa-brands fa-youtube text-xl"></i>
                    </div>
                    <div class="flex-grow overflow-hidden">
                        <div class="text-xs font-black text-amber-haze mb-1">${song.year} 年</div>
                        <h3 class="font-black text-lg text-gray-800 truncate group-hover:text-transformative-teal transition-colors">${song.title}</h3>
                        <p class="text-sm font-bold text-gray-500">${song.artist}</p>
                    </div>
                `;
                container.appendChild(item);
            });
        }
    </script>
