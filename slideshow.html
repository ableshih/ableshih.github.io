<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電視牆輪播系統 - 嘉仁里</title>
    <style>
        /* 基礎重置與全螢幕設定 */
        body, html {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%;
            background-color: #000; /* 背景全黑，避免圖片切換時閃爍白光 */
            overflow: hidden; 
            font-family: sans-serif;
        }

        /* 輪播圖片容器 */
        #slideshow-container {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1;
        }

        /* 單張圖片設定 */
        .slide {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            object-fit: cover; /* 讓圖片完美填滿螢幕，自動裁切不變形 */
            opacity: 0; /* 預設透明隱藏 */
            transition: opacity 1.5s ease-in-out; /* 1.5秒平滑淡入淡出特效 */
            z-index: 1;
        }

        /* 當前播放的圖片 */
        .slide.active { 
            opacity: 1; 
            z-index: 2; 
        }
    </style>
</head>
<body>

    <!-- 輪播圖片區 -->
    <div id="slideshow-container"></div>

<script>
        const DURATION = 4000; 
        
        let slideElements = [];
        let currentIndex = 0;
        let tryIndex = 1; 
        let intervalId = null;

        // 👑 升級：加入大寫副檔名偵測，避免相機原檔漏抓
        const extensions = ['.jpg', '.JPG', '.png', '.PNG', '.jpeg', '.JPEG', '.webp', '.gif'];
        let extIndex = 0; 

        window.onload = () => {
            autoFetchImages();
        };

        function autoFetchImages() {
            const container = document.getElementById('slideshow-container');
            const img = new Image();
            
            img.src = `image1/${tryIndex}${extensions[extIndex]}`;

            img.onload = function() {
                img.className = 'slide ' + (slideElements.length === 0 ? 'active' : '');
                container.appendChild(img);
                slideElements.push(img);

                if (slideElements.length === 2 && !intervalId) {
                    intervalId = setInterval(nextSlide, DURATION);
                }

                tryIndex++;
                extIndex = 0; 
                autoFetchImages();
            };

            img.onerror = function() {
                extIndex++;
                if (extIndex < extensions.length) {
                    autoFetchImages();
                } else {
                    console.log(`自動抓取完畢，共載入 ${slideElements.length} 張圖片。`);
                    if (slideElements.length === 0) {
                        container.innerHTML = '<div style="color: white; text-align: center; margin-top: 20%; font-size: 24px;">找不到圖片！<br>請確認 image1 資料夾與網頁放在一起，且圖片命名為 1, 2, 3...</div>';
                    }
                }
            };
        }

        function nextSlide() {
            if (slideElements.length <= 1) return;
            slideElements[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % slideElements.length;
            slideElements[currentIndex].classList.add('active');
        }

        document.addEventListener('dblclick', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => {});
            } else {
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
