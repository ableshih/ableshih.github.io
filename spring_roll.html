<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>松興潤餅 施秋松 2007 春天潤餅文化節 - 施圳溪</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        'transformative-teal': '#306263',
                        'transformative-teal-dark': '#23494A',
                        'cloud-dancer': '#F0EEE9',
                        'amber-haze': '#D9A441' 
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F0EEE9; color: #1F2937; }
        .pattern-bg {
            background-image: radial-gradient(#F0EEE9 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #306263;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col selection:bg-transformative-teal selection:text-cloud-dancer">

    <!-- 頂部導覽列 -->
    <header class="pattern-bg text-cloud-dancer py-4 px-6 shadow-md flex justify-between items-center z-10 sticky top-0">
        <div>
            <h1 class="text-2xl font-black tracking-widest">施圳溪 <span class="text-sm font-medium opacity-80 ml-2 tracking-normal">嘉仁里里長參選人</span></h1>
        </div>
        <a href="index.html" class="bg-amber-haze text-transformative-teal-dark px-4 py-2 rounded-full font-bold text-sm hover:bg-white transition-colors flex items-center gap-2">
            <i class="fa-solid fa-house"></i> 回首頁
        </a>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-6 py-12 flex flex-col justify-center">
        
        <!-- 頁面標題 -->
        <div class="text-center mb-8 border-b-2 border-transformative-teal-dark/10 pb-6">
            <div class="inline-block bg-transformative-teal text-cloud-dancer font-bold px-3 py-1 rounded-full text-sm mb-3 tracking-widest shadow-sm">
                COMMUNITY MEMORY
            </div>
            <h2 class="text-3xl md:text-4xl font-black text-transformative-teal tracking-wider mb-2">松興潤餅 施秋松</h2>
            <p class="text-lg text-gray-600 font-medium">2007 春天潤餅文化節 影像紀錄</p>
        </div>

        <!-- YouTube 影片區塊 -->
        <!-- 運用 padding-top: 56.25% 維持 16:9 或 4:3 適應的完美比例 -->
        <div class="relative w-full overflow-hidden rounded-xl shadow-2xl bg-black mx-auto max-w-[900px] border-4 border-white" style="padding-top: 56.25%;">
            <iframe 
                class="absolute top-0 left-0 w-full h-full"
                src="https://www.youtube.com/embed/C3-cATmsX7s" 
                title="松興潤餅 施秋松 2007 春天潤餅文化節" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen>
            </iframe>
        </div>
        
    </main>

    <!-- 簡易頁尾 -->
    <footer class="bg-transformative-teal-dark text-cloud-dancer py-8 text-center border-t-8 border-amber-haze mt-auto">
        <p class="text-sm opacity-80">2026 施圳溪競選團隊・扎根嘉仁 永續躍進</p>
    </footer>

</body>
</html>
