        document.addEventListener("DOMContentLoaded", () => {
            // 自動計算「當選狀態」 (依據得票數前 7 名)
            // 安樂區標準席次為 7 席，程式會自動將每年票數前 7 名標記為當選。
            const years = [...new Set(electionData.map(d => d.year))];
            years.forEach(y => {
                let yearData = electionData.filter(d => d.year === y);
                // 依照票數排序
                yearData.sort((a, b) => b.votes - a.votes);
                // 標記前 7 名
                yearData.forEach((d, index) => {
                    d.isElected = index < 7;
                });
            });

            populateSelects();
            renderTable();

            // 綁定篩選器事件
            ['Year', 'Name', 'Party'].forEach(key => {
                document.getElementById(`filter${key}`).addEventListener('change', filterData);
            });

            // 回到頂部按鈕邏輯
            const backToTopBtn = document.getElementById("backToTopBtn");
            window.addEventListener("scroll", () => {
                if (window.scrollY > 300) backToTopBtn.classList.add("show");
                else backToTopBtn.classList.remove("show");
            });
            backToTopBtn.addEventListener("click", (e) => {
                e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" });
            });
        });

        // 填入下拉選單選項
        function populateSelects() {
            const createOptions = (selectId, key) => {
                const select = document.getElementById(selectId);
                const uniqueVals = [...new Set(electionData.map(item => item[key]))].sort();
                
                // 保留第一項 "全部"
                while(select.options.length > 1) { select.remove(1); }
                
                uniqueVals.forEach(val => {
                    select.add(new Option(val, val));
                });
            };

            createOptions('filterName', 'name');
            createOptions('filterParty', 'party');
        }

        // 執行篩選
        function filterData() {
            const fYear = document.getElementById('filterYear').value;
            const fName = document.getElementById('filterName').value;
            const fParty = document.getElementById('filterParty').value;

            currentData = electionData.filter(item => {
                return (fYear === 'all' || item.year.toString() === fYear) &&
                       (fName === 'all' || item.name === fName) &&
                       (fParty === 'all' || item.party === fParty);
            });

            doSort(); // 篩選後維持當前排序
        }

        // 重置篩選
        function resetFilters() {
            document.getElementById('filterYear').value = 'all';
            document.getElementById('filterName').value = 'all';
            document.getElementById('filterParty').value = 'all';
            filterData();
        }

        // 點擊表頭排序
        function sortTable(column) {
            if (sortCol === column) {
                sortAsc = !sortAsc; // 反轉順序
            } else {
                sortCol = column;
                sortAsc = (column === 'name' || column === 'party') ? true : false; // 文字預設正向，數字預設反向(由高到低)
            }
            doSort();
        }

        // 執行排序與渲染
        function doSort() {
            currentData.sort((a, b) => {
                let valA = a[sortCol];
                let valB = b[sortCol];

                if (typeof valA === 'string') {
                    return sortAsc ? valA.localeCompare(valB, 'zh-TW') : valB.localeCompare(valA, 'zh-TW');
                } else {
                    return sortAsc ? valA - valB : valB - valA;
                }
            });
            renderTable();
        }

        // 渲染表格
        function renderTable() {
            const tableBody = document.getElementById('dataTable');
            document.getElementById('resultCount').textContent = currentData.length;
            tableBody.innerHTML = '';

            if (currentData.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-gray-500 font-bold">找不到符合條件的資料</td></tr>`;
                return;
            }

            let htmlString = '';
            currentData.forEach((item, index) => {
                const rowClass = index % 2 === 0 ? 'bg-white' : 'bg-[#f8f5f0]';
                
                // 黨籍顏色特效
                let partyBadge = `<span class="px-2 py-1 rounded text-sm font-bold bg-gray-100 text-gray-600 border border-gray-200">${item.party}</span>`;
                if (item.party === '中國國民黨') {
                    partyBadge = `<span class="px-2 py-1 rounded text-sm font-bold bg-blue-50 text-blue-700 border border-blue-200">${item.party}</span>`;
                } else if (item.party === '民主進步黨') {
                    partyBadge = `<span class="px-2 py-1 rounded text-sm font-bold bg-green-50 text-green-700 border border-green-200">${item.party}</span>`;
                } else if (item.party === '親民黨') {
                    partyBadge = `<span class="px-2 py-1 rounded text-sm font-bold bg-orange-50 text-orange-700 border border-orange-200">${item.party}</span>`;
                } else if (item.party === '時代力量') {
                    partyBadge = `<span class="px-2 py-1 rounded text-sm font-bold bg-yellow-50 text-yellow-700 border border-yellow-200">${item.party}</span>`;
                } else if (item.party === '台灣民眾黨') {
                    partyBadge = `<span class="px-2 py-1 rounded text-sm font-bold bg-cyan-50 text-cyan-700 border border-cyan-200">${item.party}</span>`;
                } else if (item.party === '新黨') {
                    partyBadge = `<span class="px-2 py-1 rounded text-sm font-bold bg-yellow-100 text-yellow-800 border border-yellow-300">${item.party}</span>`;
                }

                // 當選特效
                let electedBadge = `<span class="text-gray-400 font-medium">未當選</span>`;
                if (item.isElected) {
                    electedBadge = `<span class="bg-amber-haze text-white font-black px-3 py-1 rounded-full shadow-sm"><i class="fa-solid fa-crown mr-1"></i> 當選</span>`;
                }

                htmlString += `
                    <tr class="${rowClass} hover:bg-transformative-teal/10 transition-colors">
                        <td class="p-4 border-b border-gray-200 font-bold text-gray-500">${item.yearLabel}</td>
                        <td class="p-4 border-b border-gray-200 font-black text-transformative-teal-dark text-lg">${item.name}</td>
                        <td class="p-4 border-b border-gray-200">${partyBadge}</td>
                        <td class="p-4 border-b border-gray-200 font-black text-amber-haze text-xl text-right">${item.votes.toLocaleString()}</td>
                        <td class="p-4 border-b border-gray-200 font-medium text-gray-500 text-right">${item.percent}</td>
                        <td class="p-4 border-b border-gray-200 text-center">${electedBadge}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = htmlString;
        }
    </script>
</body>
</html>
