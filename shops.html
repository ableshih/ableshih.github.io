<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在地店家與手藝人 - 施圳溪 | 嘉仁里里長參選人</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        'transformative-teal': '#306263',
                        'transformative-teal-dark': '#23494A',
                        'cloud-dancer': '#F0EEE9',
                        'amber-haze': '#D9A441' 
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #F0EEE9; /* Cloud Dancer */
            color: #1F2937; 
        }
        .pattern-bg {
            background-image: radial-gradient(#F0EEE9 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #306263;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col selection:bg-transformative-teal selection:text-cloud-dancer">

    <!-- 頂部導覽列 -->
    <header class="pattern-bg text-cloud-dancer py-4 px-6 shadow-md flex justify-between items-center z-10">
        <div>
            <h1 class="text-2xl font-black tracking-widest">施圳溪 <span class="text-sm font-medium opacity-80 ml-2 tracking-normal">嘉仁里里長參選人</span></h1>
        </div>
        <a href="https://ableshih.github.io/" class="bg-amber-haze text-transformative-teal-dark px-4 py-2 rounded-full font-bold text-sm hover:bg-white transition-colors flex items-center gap-2">
            <i class="fa-solid fa-house"></i> 回首頁
        </a>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-6xl mx-auto px-6 py-12 md:py-20 w-full">
        
        <!-- 頁面標題 -->
        <div class="text-center mb-16">
            <div class="inline-block bg-transformative-teal text-cloud-dancer font-bold px-3 py-1 rounded-full text-sm mb-4 tracking-widest shadow-sm">
                COMMUNITY DIRECTORY
            </div>
            <h2 class="text-4xl md:text-5xl font-black text-transformative-teal tracking-wider mb-4">在地店家與手藝人</h2>
            <p class="text-xl text-gray-600 font-medium">支持在地專業，活絡嘉仁社區發展</p>
            <div class="h-1 w-24 bg-amber-haze mx-auto mt-6 rounded"></div>
        </div>

        <!-- 
            按鈕導覽網格區
            設定為手機版每排 2 個，平板 3 個，電腦版 5 個 
        -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6 md:gap-8">
            
            <!-- 1. 機車店按鈕 -->
            <!-- hover:scale-110 負責變大動畫，hover:bg-amber-haze 負責換色 -->
            <a href="shop-motorcycle.html" class="group flex flex-col items-center justify-center p-8 bg-white border-b-4 border-transformative-teal rounded-2xl shadow-md transition-all duration-300 transform hover:scale-110 hover:bg-amber-haze hover:border-transformative-teal-dark hover:shadow-2xl cursor-pointer text-center">
                <i class="fa-solid fa-motorcycle text-5xl text-transformative-teal group-hover:text-white transition-colors mb-4"></i>
                <h3 class="text-xl font-bold text-gray-800 group-hover:text-transformative-teal-dark transition-colors">機車店</h3>
            </a>

            <!-- 2. 水電按鈕 -->
            <a href="shop-plumbing.html" class="group flex flex-col items-center justify-center p-8 bg-white border-b-4 border-transformative-teal rounded-2xl shadow-md transition-all duration-300 transform hover:scale-110 hover:bg-amber-haze hover:border-transformative-teal-dark hover:shadow-2xl cursor-pointer text-center">
                <i class="fa-solid fa-plug text-5xl text-transformative-teal group-hover:text-white transition-colors mb-4"></i>
                <h3 class="text-xl font-bold text-gray-800 group-hover:text-transformative-teal-dark transition-colors">水電</h3>
            </a>

            <!-- 3. 防水按鈕 -->
            <a href="shop-waterproof.html" class="group flex flex-col items-center justify-center p-8 bg-white border-b-4 border-transformative-teal rounded-2xl shadow-md transition-all duration-300 transform hover:scale-110 hover:bg-amber-haze hover:border-transformative-teal-dark hover:shadow-2xl cursor-pointer text-center">
                <i class="fa-solid fa-droplet-slash text-5xl text-transformative-teal group-hover:text-white transition-colors mb-4"></i>
                <h3 class="text-xl font-bold text-gray-800 group-hover:text-transformative-teal-dark transition-colors">防水</h3>
            </a>

            <!-- 4. 宮廟按鈕 -->
            <a href="shop-temple.html" class="group flex flex-col items-center justify-center p-8 bg-white border-b-4 border-transformative-teal rounded-2xl shadow-md transition-all duration-300 transform hover:scale-110 hover:bg-amber-haze hover:border-transformative-teal-dark hover:shadow-2xl cursor-pointer text-center">
                <i class="fa-solid fa-vihara text-5xl text-transformative-teal group-hover:text-white transition-colors mb-4"></i>
                <h3 class="text-xl font-bold text-gray-800 group-hover:text-transformative-teal-dark transition-colors">宮廟</h3>
            </a>

            <!-- 5. 家教按鈕 -->
            <a href="shop-tutor.html" class="group flex flex-col items-center justify-center p-8 bg-white border-b-4 border-transformative-teal rounded-2xl shadow-md transition-all duration-300 transform hover:scale-110 hover:bg-amber-haze hover:border-transformative-teal-dark hover:shadow-2xl cursor-pointer text-center">
                <i class="fa-solid fa-book-open-reader text-5xl text-transformative-teal group-hover:text-white transition-colors mb-4"></i>
                <h3 class="text-xl font-bold text-gray-800 group-hover:text-transformative-teal-dark transition-colors">家教</h3>
            </a>

        </div>

    </main>

    <!-- 簡易頁尾 -->
    <footer class="bg-transformative-teal-dark text-cloud-dancer py-8 text-center border-t-8 border-amber-haze">
        <p class="text-sm opacity-80">2026 施圳溪競選團隊・扎根嘉仁 永續躍進</p>
    </footer>

</body>
</html>
