<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>嘉仁里競選看板 - 極大字體橫直自適應版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0b2242;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }

        #slogan-container {
            width: 95vw; /* 稍微擴大可用寬度，讓大字更好排版 */
            height: 95vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #slogan-text {
            font-weight: 900;
            color: #ffcc00;
            line-height: 1.3; /* 字變大後，行距稍微縮緊會更好看 */
            text-shadow: 6px 6px 15px rgba(0, 0, 0, 0.8);
            transition: opacity 0.8s ease-in-out, font-size 0.5s ease;
            
            /* 【關鍵修改】讓大字體遇到螢幕邊緣時，中文字能自動換行往下排 */
            word-break: break-all; 
            overflow-wrap: break-word;
        }
    </style>
</head>
<body>

    <div id="slogan-container">
        <div id="slogan-text">載入中...</div>
    </div>

    <script>
        const originalSlogans = [

			"四年過四年\n嘟蘭變無奈",

			"青年要未來\n中年免嘟蘭\n長輩有靠山！",
			"少年免等\n中年免氣\n長輩好安居",

			"老人沒票\n也是要顧！",

			"說到做到\n用票表態！",
			"改變要實現\n請您站出來！",
			"選票投給妳\n凡事推給乾兒子",
			"自己的里民親自顧\n麥哥找乾兒來應付！",
			"大官擺架子\n服務丟給乾兒子",

			"無薪不是藉口\n代誌還是要做",

			"既然當選要承擔\n無薪不是擋箭牌！",
			"不領薪水免邀功\n里內代誌不能空！",
			"里長本來就沒薪水\n莫在講妳無愛薪水！",
			"沒薪水是常識\n不做事是事實",

			"里長本來無薪水\n莫擱假仙騙選票！",
			"免拿無薪來邀功\n里民要的是做工！",
			"無薪不是擋箭牌\n做袂來就換我來！",
			"錢花去哪裡？\n明細請踹共！",
			"里民是頭家\n帳目全公開！",
			"不敢公開明細\n到底在怕啥？",
			"拒絕里政黑箱\n明細攤在陽光下",
			"帳目要透明\n對里民有交代！",
			"長輩挺新人\n新人顧老人！",
			"牽成少年家\n作伙拚未來！",
			"新人有衝勁\n顧老尚有力！",
			"長輩來疼惜\n乎少年來打拚！",
			"交棒新世代\n長輩有依賴！",
			"還我里民客廳\n開門開課大家用",
			"會堂不是私有產\n打開大門還里民",
			"會堂空間里民用\n開門開課免通融",
			"拒絕會堂鎖緊緊\n開門活化為鄉親",
			"公共空間要公開\n開門開課作伙來",
			"雜草不割變小樹\n放爛不管金了然",
			"雜草變樹無人管\n這種里長趕緊換",
			"雜草不割變叢林\n里長做事沒用心",
			"拒絕雜草變小樹\n里內環境我來顧",
			"小事拖延變大事\n除草清溝換我治",
			"雜草不哥變小樹\n小樹不哥金了然",
			"有溝通才能解\n愛嗆聲無路用！",
			"做事免大聲\n溝通尚要緊！",
			"嗆聲不能解題\n溝通才能雙贏！",
			"少一點口水嗆聲\n多一點理性溝通",
			"拒絕惡意嗆聲\n作伙好好溝通",
			"要了解要溝通\n嗆聲沒啥小路用！",
			"有事作伙參詳\n麥動不動叫環保！",
			"里政需要人情味\n麥叫環保太鴨霸",
			"有事好好講\n別拿開單當日常",
			"傾聽取代檢舉\n溝通解決問題！",
			"不聽里民心聲\n只會叫環保局！",
			"去了解里民的想法\n不要動不動環保局",
			"嘉仁要進步\n圳溪來帶路！",
			"深耕嘉仁\n圳溪最認真！",
			"嘉仁大躍進\n圳溪拚出陣！",
			"作伙挺圳溪\n嘉仁大起飛！",
			"嘉仁要升級\n交給施圳溪！",
			"程式設計師\n里政管理施！",
			"你的期盼\n我來打拚！",
			"說到做到\n作伙實現！",
			"鄉親的心願\n圳溪來承擔！",
			"你敢期待\n我敢拚命！",
			"希望交給我\n未來作伙拚！",
			"挺嘉仁\n顧家人！",
			"嘉仁大小事\n當作自家事！",
			"嘉仁親像一家人\n安全服務我來擔！",
			"把嘉仁當家人\n用心服務最溫暖",
			"守護嘉仁就是\n守護我們的家人",
			"服務馬上辦\n嘉仁換新衫！",
			"愛心顧家人\n文化造嘉仁！",
			"里政拚效率\n社區大升級！",
			"創新帶活力\n行善最用心！",
			"作伙做愛心\n嘉仁添創新！",
			"四季種好花\n嘉仁尚蓋水！",
			"巷弄開滿花\n社區變花園！",
			"花草你我顧\n環境水噹噹！",
			"季季有花香\n點亮咱嘉仁！",
			"一季一特色\n打造新嘉仁！",
			"長輩有伴來開講\n老幼作伙笑聲滿！",
			"種花拜拜有人伴\n疼惜咱的老人伴！",
			"青銀共學好厝邊\n長輩歡喜免煩惱！",
			"嘉仁長輩不孤單\n出門作伴樂安康！",
			"顧老顧幼好社區\n作伙種花好過日！",
			"服務時數免煩惱\n嘉仁就是大教室！",
			"多語導覽接地氣\n學生履歷最加分！",
			"來做嘉仁代言人\n服務學習我挺你！",
			"外語解說秀實力\n社區服務拿時數！",
			"家裡學生請站出來\n用外語行銷嘉仁里",
			"安心上班拚經濟\n拿藥團購我幫你！",
			"代拿藥、揪團購\n圳溪做你的神隊友",
			"生活瑣事我來喬\n下班回家輕鬆理！",
			"健康把關有藥師\n社區服務最省時！",
			"社區升級超便利\n用藥安全顧身體！",
			"信仰不分家\n作伙顧嘉仁！",
			"善心相挺\n有信必成！",
			"匯聚宗教善念\n打造溫暖社區",
			"心中有信仰\n做事有力量！",
			"正念聚善緣\n作伙行大愛！",
			"人要有信\n必將成就！",
			"做袂來就麥做\n換我來打拚！",
			"不會做、不想做\n這票換我做！",
			"無心服務麥勉強\n代誌交給我來做！",
			"別人放爛不願做\n換我出來作伙拚！",
			"做嘸路來就換人\n嘉仁未來交給我！",
			"會堂變教室\n作伙來相學！",
			"會堂升級活起來\n大家作伙學功夫！",
			"打開會堂不閒置\n社區共學好日子！",
			"里民會堂咱的厝\n共學成長逗陣拚！",
			"空間開放大家用\n作伙學習尚歡喜！",
			"AI 來幫忙\n生活卡便利！",
			"科技好厝邊\n嘉仁大升級！",
			"里政用科技\n服務尚蓋快！",
			"智慧新嘉仁\n作伙拚第一！",
			"AI 顧鄉親\n社區換新衫！",
			"一次翻乎倒\n未來免操煩！",
			"這票大翻盤\n照有沒未來！",
			"舊政翻乎倒\n好日子就到！",
			"這次翻乎倒\n嘉仁會更好！",
			"全面大翻盤\n未來換我擔！"
        ];

        let shuffledSlogans = [];
        let currentIndex = 0;
        const sloganElement = document.getElementById('slogan-text');

        // 【關鍵加入】洗牌函數 (Fisher-Yates Shuffle)
        function shuffleArray(array) {
            let newArray = array.slice(); // 複製陣列避免動到原資料
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function updateSlogan() {
            // 如果這是第一次執行，或是已經把這輪洗好的牌播完了，就重新洗牌
            if (currentIndex >= shuffledSlogans.length) {
                shuffledSlogans = shuffleArray(originalSlogans);
                currentIndex = 0; // 重置索引
            }

            sloganElement.style.opacity = 0;
            
            setTimeout(() => {
                // 從洗好的陣列中取出一句
                const currentText = shuffledSlogans[currentIndex];
                sloganElement.innerHTML = currentText.replace(/\n/g, '<br>');

                const charCount = currentText.replace(/\n/g, '').length;
                
                // 【關鍵修改】：動態偵測螢幕是「橫式」還是「直式」
                const isLandscape = window.innerWidth > window.innerHeight;
                let calculatedFontSize;

                if (isLandscape) {
                    // 橫式螢幕專用比例：將 vmin 數值大幅縮小，確保七個字以上的長句不會超出兩側邊界
                    if (charCount <= 8) calculatedFontSize = 22; 
                    else if (charCount <= 14) calculatedFontSize = 18; 
                    else if (charCount <= 20) calculatedFontSize = 14; 
                    else calculatedFontSize = 11; 
                } else {
                    // 直式螢幕專用比例：維持原本為 32 吋直立看板設計的極大字體
                    if (charCount <= 8) calculatedFontSize = 40; 
                    else if (charCount <= 14) calculatedFontSize = 30; 
                    else if (charCount <= 20) calculatedFontSize = 24; 
                    else calculatedFontSize = 18; 
                }

                sloganElement.style.fontSize = calculatedFontSize + 'vmin';
                sloganElement.style.opacity = 1;
                
                // 推進到下一句
                currentIndex++;
            }, 800); 
        }

        updateSlogan();
        setInterval(updateSlogan, 7000);
        
        // 加入螢幕翻轉時的即時重算機制，讓您在手機上測試翻轉時能立即看到變化
        window.addEventListener('resize', () => {
            // 由於設定了過渡動畫，直接重新呼叫 updateSlogan 會導致換字，因此這裡僅重新計算當前文字大小
            const isLandscape = window.innerWidth > window.innerHeight;
            const currentText = shuffledSlogans[currentIndex === 0 ? shuffledSlogans.length - 1 : currentIndex - 1];
            if (!currentText) return;
            const charCount = currentText.replace(/\n/g, '').length;
            
            let calculatedFontSize;
            if (isLandscape) {
                if (charCount <= 8) calculatedFontSize = 22; 
                else if (charCount <= 14) calculatedFontSize = 18; 
                else if (charCount <= 20) calculatedFontSize = 14; 
                else calculatedFontSize = 11; 
            } else {
                if (charCount <= 8) calculatedFontSize = 40; 
                else if (charCount <= 14) calculatedFontSize = 30; 
                else if (charCount <= 20) calculatedFontSize = 24; 
                else calculatedFontSize = 18; 
            }
            sloganElement.style.fontSize = calculatedFontSize + 'vmin';
        });
    </script>
</body>
</html>
