    <title>嘉仁里競選看板 - 極大字體橫直自適應版</title>
    <style>
        body {
            margin: 0;

            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0b2242;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }

        #slogan-container {
            /* 預留 10% 的安全邊距，確保大字不會完全貼死螢幕邊緣 */
            width: 90vw; 
            height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

		#slogan-text {
            /* 將 900 改為 bold (一般粗體) 或 normal (標準體) */
            font-weight: normal; 
            color: #ffcc00;
            line-height: 1.25; 
            /* 稍微調小陰影的擴散範圍，避免黑色陰影讓字邊緣看起來糊糊的 */
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.8); 
            transition: opacity 0.8s ease-in-out; 
            word-break: break-all; 
            overflow-wrap: break-word;
        }
    </style>
</head>

			"打開會堂不閒置\n社區共學好日子",

			"空間開放大家用\n作伙學習尚歡喜",
			"AI 來幫忙\n生活卡便利！",

			"AI 顧鄉親\n社區換新衫！",
			"一次翻乎倒\n未來免操煩！",
			"這票大翻盤\n照有沒未來！",
			"舊政翻乎倒\n好日子就到！",
			"這次翻乎倒\n嘉仁會更好！",
			"全面大翻盤\n未來換我擔！"

        let playList = [];
        let currentIndex = 0;
        const container = document.getElementById('slogan-container');
        const sloganElement = document.getElementById('slogan-text');

        // 【關鍵加入】洗牌函數 (Fisher-Yates Shuffle)
        function shuffleArray(array) {
            let newArray = array.slice(); // 複製陣列避免動到原資料
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // 根據開關決定播放列表
        function preparePlayList() {
            if (useRandomShuffle) {
                playList = shuffleArray(originalSlogans);
            } else {
                playList = originalSlogans.slice(); // 複製原陣列，保持順序
            }
            currentIndex = 0;
        }

        function autoFitFontSize() {
            let min = 10;   // 最小字體
            let max = 1000; // 最大字體
            let best = min;

            // 在背景極速測試不同字體大小
            while (min <= max) {
                let mid = Math.floor((min + max) / 2);
                sloganElement.style.fontSize = mid + 'px';

                // 檢查這個字體大小有沒有讓文字超出容器的寬度或高度
                if (sloganElement.offsetWidth <= container.clientWidth && 
                    sloganElement.offsetHeight <= container.clientHeight) {
                    best = mid;    // 沒超出，記錄起來
                    min = mid + 1; // 繼續嘗試放更大
                } else {
                    max = mid - 1; // 超出了，縮小一點
                }
            }

            // 抓到極限尺寸後，稍微縮小 5%，確保畫面邊緣有一點呼吸空間
            sloganElement.style.fontSize = Math.floor(best * 0.95) + 'px';
        }

        function updateSlogan(isFirst = false) {
            // 播放完一輪後重新準備播放列表
            if (currentIndex >= playList.length) {
                preparePlayList();
            }

            sloganElement.style.opacity = 0;
            
            // 如果是第一次載入，不需要等待淡出動畫；其餘則等待 0.8 秒淡出
            setTimeout(() => {
                const currentText = playList[currentIndex];
                sloganElement.innerHTML = currentText.replace(/\n/g, '<br>');

                // 【關鍵】：文字換上去的瞬間，自動計算最大字體
                autoFitFontSize();
                
                sloganElement.style.opacity = 1;
                
                // 推進到下一句
                currentIndex++;
            }, isFirst ? 0 : 800); 
        }

        // 當你在手機上把直式翻轉成橫式時，會觸發這個事件重新計算字體大小
        window.addEventListener('resize', () => {
            autoFitFontSize();
        });

        // 初始準備與啟動
        preparePlayList();
        updateSlogan(true);
        setInterval(() => updateSlogan(false), 7000);
    </script>

	<!-- 隱藏的背景音樂播放器 -->
    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const audio = document.getElementById("bg-music");
            
            // 嘗試載入後直接播放
            const playPromise = audio.play();
            
            // 現代瀏覽器嚴格禁止網頁在沒有互動的情況下「自動發出聲音」
            // 若自動播放被阻擋，則設定在使用者「第一次點擊、滑動或觸控螢幕」時，立刻無縫啟動音樂
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    const startAudio = () => {
                        audio.play();
                        // 播放成功後移除監聽器，避免耗費效能
                        document.removeEventListener("click", startAudio);
                        document.removeEventListener("touchstart", startAudio);
                        document.removeEventListener("scroll", startAudio);
                    };
                    document.addEventListener("click", startAudio);
                    document.addEventListener("touchstart", startAudio);
                    document.addEventListener("scroll", startAudio, { passive: true });
                });
            }
        });
    </script>
