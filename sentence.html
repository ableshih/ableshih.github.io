        let currentIndex = 0;
        const sloganElement = document.getElementById('slogan-text');

        function updateSlogan() {
            // 先將透明度設為 0 (淡出)
            sloganElement.style.opacity = 0;
            
            setTimeout(() => {
                // 更換文字
                sloganElement.innerText = slogans[currentIndex];
                // 將透明度恢復為 1 (淡入)

                // 推進索引
                currentIndex = (currentIndex + 1) % slogans.length;
            }, 500); // 等待 0.5 秒淡出後換字
        }

        // 初始執行一次
        updateSlogan();
        // 每 6 秒切換一次標語
        setInterval(updateSlogan, 6000);
