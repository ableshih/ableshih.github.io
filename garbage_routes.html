<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安樂區 垃圾車時刻表 (依時間查詢)</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] },
                    colors: {
                        'transformative-teal': '#306263',
                        'transformative-teal-dark': '#23494A',
                        'cloud-dancer': '#F0EEE9',
                        'amber-haze': '#D9A441' 
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F0EEE9; color: #1F2937; scroll-behavior: smooth; }
        .pattern-bg {
            background-image: radial-gradient(#F0EEE9 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #306263;
        }
        
        ::-webkit-scrollbar { display: none; }
        
        #backToTopBtn {
            position: fixed; bottom: 30px; right: 30px; z-index: 99;
            opacity: 0; visibility: hidden; transition: all 0.3s ease-in-out; transform: translateY(20px);
        }
        #backToTopBtn.show { opacity: 1; visibility: visible; transform: translateY(0); }

        /* 時段按鈕啟用狀態 */
        .time-btn.active {
            background-color: #D9A441; /* amber-haze */
            color: #23494A;
            border-color: #D9A441;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="pattern-bg text-cloud-dancer py-4 px-6 shadow-md flex justify-between items-center z-20 sticky top-0">
        <div>
            <h1 class="text-xl md:text-2xl font-black tracking-widest"><i class="fa-solid fa-clock mr-2 text-amber-haze"></i>安樂區 垃圾車時刻表</h1>
        </div>
        <a href="index.html" class="bg-amber-haze text-transformative-teal-dark px-4 py-2 rounded-full font-bold text-sm hover:bg-white transition-colors flex items-center gap-2 shadow-sm shrink-0">
            <i class="fa-solid fa-house"></i> 首頁
        </a>
    </header>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-6 md:py-8">
        
        <!-- 說明與過濾面板 -->
        <div class="bg-white rounded-2xl shadow-md border-t-8 border-transformative-teal mb-6 p-5 md:p-6 sticky top-[72px] z-10">
            <h2 class="text-lg md:text-xl font-bold text-transformative-teal-dark mb-3"><i class="fa-solid fa-filter mr-2"></i>您想尋找哪個時段的垃圾車？</h2>
            
            <!-- 時段過濾按鈕 -->
            <div class="flex flex-wrap gap-2 md:gap-3" id="timeFilters">
                <button class="time-btn active px-4 py-2 rounded-full border-2 border-gray-200 text-gray-600 font-bold text-sm transition-colors hover:bg-gray-50" data-hour="all">全部時間</button>
                <button class="time-btn px-4 py-2 rounded-full border-2 border-gray-200 text-gray-600 font-bold text-sm transition-colors hover:bg-gray-50" data-hour="16">16:00 時段</button>
                <button class="time-btn px-4 py-2 rounded-full border-2 border-gray-200 text-gray-600 font-bold text-sm transition-colors hover:bg-gray-50" data-hour="17">17:00 時段</button>
                <button class="time-btn px-4 py-2 rounded-full border-2 border-gray-200 text-gray-600 font-bold text-sm transition-colors hover:bg-gray-50" data-hour="18">18:00 時段</button>
                <button class="time-btn px-4 py-2 rounded-full border-2 border-gray-200 text-gray-600 font-bold text-sm transition-colors hover:bg-gray-50" data-hour="19">19:00 時段</button>
                <button class="time-btn px-4 py-2 rounded-full border-2 border-gray-200 text-gray-600 font-bold text-sm transition-colors hover:bg-gray-50" data-hour="20">20:00 時段</button>
                <button class="time-btn px-4 py-2 rounded-full border-2 border-gray-200 text-gray-600 font-bold text-sm transition-colors hover:bg-gray-50" data-hour="21">21:00 時段</button>
            </div>
            
            <div class="mt-4 flex items-center justify-between text-sm text-gray-500 font-bold">
                <span id="resultCount">共載入 0 筆停靠資訊</span>
            </div>
        </div>

        <!-- 綜合時間軸 -->
        <div class="bg-white rounded-2xl shadow-md p-4 md:p-6 border border-gray-200">
            <div id="timelineContainer" class="space-y-4">
                <!-- JS 動態生成 timeline items -->
            </div>
        </div>

    </main>

            const backToTopBtn = document.getElementById("backToTopBtn");
            window.addEventListener("scroll", () => {
                if (window.scrollY > 300) backToTopBtn.classList.add("show");
                else backToTopBtn.classList.remove("show");
            });
            backToTopBtn.addEventListener("click", (e) => {
                e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" });
            });
        });

        // 渲染畫面
        function renderTimeline(hourFilter) {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';

            let filteredStops = allStops;
            if (hourFilter !== 'all') {
                filteredStops = allStops.filter(stop => stop.hour === hourFilter);
            }

            document.getElementById('resultCount').innerText = `共載入 ${filteredStops.length} 筆停靠資訊`;

            if (filteredStops.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-500 font-bold">這個時段目前沒有垃圾車班次喔！</div>`;
                return;
            }

            filteredStops.forEach((stop) => {
                const item = document.createElement('div');
                item.className = 'bg-[#f8f5f0] p-4 md:p-5 rounded-xl shadow-sm hover:shadow-md transition-shadow border border-gray-100 flex flex-col md:flex-row gap-3 md:gap-6 items-start md:items-center';
                
                item.innerHTML = `
                    <!-- 左側：醒目的時間 -->
                    <div class="text-transformative-teal font-black text-2xl md:text-3xl shrink-0 flex items-center md:w-48">
                        <i class="fa-regular fa-clock mr-2 text-xl text-amber-haze"></i> ${stop.time}
                    </div>
                    
                    <!-- 右側：地點與附屬資訊 -->
                    <div class="flex-grow">
                        <div class="font-bold text-lg md:text-xl text-gray-800 mb-2">${stop.location}</div>
                        
                        <div class="flex flex-wrap gap-2 text-xs md:text-sm font-bold">
                            <a href="${stop.link}" target="_blank" class="bg-transformative-teal/10 text-transformative-teal hover:bg-transformative-teal hover:text-white px-2 py-1 rounded transition-colors" title="查看官方路線地圖">
                                <i class="fa-solid fa-truck"></i> 路線 ${stop.route}
                            </a>
                            <span class="bg-gray-200 text-gray-600 px-2 py-1 rounded">
                                <i class="fa-solid fa-recycle"></i> ${stop.recycle}
                            </span>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }
    </script>
</body>
</html>
