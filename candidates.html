        // 轉換資料為物件陣列
        const parseData = (text) => {
            return text.trim().split('\n').map(line => {
                // 過濾掉多餘的空白或 Tab
                const parts = line.trim().split(/\s+/);
                if(parts.length >= 4) {
                    return {
                        district: parts[0],
                        neighborhood: parts[1],
                        name: parts[2],
                        party: parts[3]
                    };
                }
                return null;
            }).filter(item => item !== null);
        };

        const candidates = parseData(rawData);

        // 取得唯一的行政區與政黨清單
        const districts = [...new Set(candidates.map(c => c.district))];
        const parties = [...new Set(candidates.map(c => c.party))];

        // 取得 DOM 元素
        const districtSelect = document.getElementById('districtFilter');
        const neighborhoodSelect = document.getElementById('neighborhoodFilter');
        const partySelect = document.getElementById('partyFilter');
        const dataTable = document.getElementById('dataTable');
        const noDataMessage = document.getElementById('noDataMessage');
        const dataCount = document.getElementById('dataCount');

        // 初始化選單
        const initSelects = () => {
            districts.forEach(d => {
                const option = document.createElement('option');
                option.value = d;
                option.textContent = d;
                districtSelect.appendChild(option);
            });

            parties.forEach(p => {
                const option = document.createElement('option');
                option.value = p;
                // 自動對應完整政黨名稱
                let partyName = p;
                if (p === '無') partyName = '無黨籍';
                if (p === '國') partyName = '中國國民黨';
                if (p === '民') partyName = '民主進步黨';
                if (p === '人') partyName = '人民民主黨';
                
                option.textContent = partyName;
                partySelect.appendChild(option);
            });
        };

        // 更新里別選單 (根據選擇的行政區自動剔除重複)
        const updateNeighborhoods = (selectedDistrict) => {
            neighborhoodSelect.innerHTML = '<option value="all">顯示所有里別</option>';
            
            if (selectedDistrict === 'all') {
                neighborhoodSelect.disabled = true;
                return;
            }

            neighborhoodSelect.disabled = false;
            const filteredNeighborhoods = [...new Set(
                candidates
                    .filter(c => c.district === selectedDistrict)
                    .map(c => c.neighborhood)
            )];

            filteredNeighborhoods.forEach(n => {
                const option = document.createElement('option');
                option.value = n;
                option.textContent = n;
                neighborhoodSelect.appendChild(option);
            });
        };

        // 渲染表格資料
        const renderTable = () => {
            const selectedDistrict = districtSelect.value;
            const selectedNeighborhood = neighborhoodSelect.value;
            const selectedParty = partySelect.value;

            const filteredData = candidates.filter(c => {
                const matchDistrict = selectedDistrict === 'all' || c.district === selectedDistrict;
                const matchNeighborhood = selectedNeighborhood === 'all' || c.neighborhood === selectedNeighborhood;
                const matchParty = selectedParty === 'all' || c.party === selectedParty;
                return matchDistrict && matchNeighborhood && matchParty;
            });

            dataTable.innerHTML = '';

            if (filteredData.length === 0) {
                noDataMessage.classList.remove('hidden');
            } else {
                noDataMessage.classList.add('hidden');
                filteredData.forEach(c => {
                    // 美化政黨標籤顯示
                    let partyClass = 'bg-gray-100 text-gray-700';
                    let partyText = '無黨籍';
                    
                    if (c.party === '國') {
                        partyClass = 'bg-blue-100 text-blue-800';
                        partyText = '國民黨';
                    } else if (c.party === '民') {
                        partyClass = 'bg-green-100 text-green-800';
                        partyText = '民進黨';
                    } else if (c.party === '人') {
                        partyClass = 'bg-red-100 text-red-800';
                        partyText = '人民民主黨';
                    }

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-teal-50 transition-colors';
                    row.innerHTML = `
                        <td class="p-4">${c.district}</td>
                        <td class="p-4 font-bold text-teal-800">${c.neighborhood}</td>
                        <td class="p-4 text-lg">${c.name}</td>
                        <td class="p-4"><span class="px-2 py-1 rounded text-sm font-bold ${partyClass}">${partyText}</span></td>
                    `;
                    dataTable.appendChild(row);
                });
            }
            
            dataCount.textContent = filteredData.length;
        };

        // 綁定事件監聽器
        districtSelect.addEventListener('change', (e) => {
            updateNeighborhoods(e.target.value);
            renderTable();
        });

        neighborhoodSelect.addEventListener('change', renderTable);
        partySelect.addEventListener('change', renderTable);

        // 執行初始化
        initSelects();
        renderTable();
    </script>
